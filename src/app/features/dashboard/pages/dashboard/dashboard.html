<section
  class="dashboard-summary"
  aria-label="Resumen de incidentes"
>
  <article class="dashboard-card dashboard-card--danger">
    <div class="dashboard-card__top">
      <span
        class="dashboard-card__icon"
        aria-hidden="true"
      >
        !
      </span>

      <div class="dashboard-card__value">
        <strong>24</strong>
        <span>Incidentes abiertos</span>
      </div>
    </div>

    <p
      class="
        dashboard-card__trend
        dashboard-card__trend--danger
      "
    >
      ↑ 12%
      <span>vs. semana anterior</span>
    </p>
  </article>

  <article class="dashboard-card dashboard-card--info">
    <div class="dashboard-card__top">
      <span
        class="dashboard-card__icon"
        aria-hidden="true"
      >
        ◷
      </span>

      <div class="dashboard-card__value">
        <strong>8</strong>
        <span>En proceso</span>
      </div>
    </div>

    <p
      class="
        dashboard-card__trend
        dashboard-card__trend--success
      "
    >
      ↓ 20%
      <span>vs. semana anterior</span>
    </p>
  </article>

  <article class="dashboard-card dashboard-card--success">
    <div class="dashboard-card__top">
      <span
        class="dashboard-card__icon"
        aria-hidden="true"
      >
        ✓
      </span>

      <div class="dashboard-card__value">
        <strong>112</strong>
        <span>Resueltos</span>
      </div>
    </div>

    <p
      class="
        dashboard-card__trend
        dashboard-card__trend--success
      "
    >
      ↑ 18%
      <span>vs. semana anterior</span>
    </p>
  </article>

  <article class="dashboard-card dashboard-card--assignment">
    <div class="dashboard-card__top">
      <span
        class="dashboard-card__icon"
        aria-hidden="true"
      >
        ●
      </span>

      <div class="dashboard-card__value">
        <strong>16</strong>
        <span>Asignados a mí</span>
      </div>
    </div>

    <p class="dashboard-card__trend">
      0%
      <span>vs. semana anterior</span>
    </p>
  </article>
</section>

<section class="dashboard-placeholder">
  <h2>Resumen operativo</h2>

  <p>
    Aquí construiremos las gráficas, incidentes recientes
    y accesos rápidos.
  </p>
</section>
