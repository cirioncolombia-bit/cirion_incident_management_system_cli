<section
  class="dashboard-summary"
  aria-label="Incident summary"
>
  <article class="dashboard-card dashboard-card--danger">
    <div class="dashboard-card__top">
      <span
        class="dashboard-card__icon"
        aria-hidden="true"
      >
        !
      </span>

      <div class="dashboard-card__value">
        <strong>24</strong>
        <span>Open incidents</span>
      </div>
    </div>

    <p
      class="
        dashboard-card__trend
        dashboard-card__trend--danger
      "
    >
      ↑ 12%
      <span>vs. previous week</span>
    </p>
  </article>

  <article class="dashboard-card dashboard-card--info">
    <div class="dashboard-card__top">
      <span
        class="dashboard-card__icon"
        aria-hidden="true"
      >
        ◷
      </span>

      <div class="dashboard-card__value">
        <strong>8</strong>
        <span>In progress</span>
      </div>
    </div>

    <p
      class="
        dashboard-card__trend
        dashboard-card__trend--success
      "
    >
      ↓ 20%
      <span>vs. previous week</span>
    </p>
  </article>

  <article class="dashboard-card dashboard-card--success">
    <div class="dashboard-card__top">
      <span
        class="dashboard-card__icon"
        aria-hidden="true"
      >
        ✓
      </span>

      <div class="dashboard-card__value">
        <strong>112</strong>
        <span>Resolved</span>
      </div>
    </div>

    <p
      class="
        dashboard-card__trend
        dashboard-card__trend--success
      "
    >
      ↑ 18%
      <span>vs. previous week</span>
    </p>
  </article>

  <article class="dashboard-card dashboard-card--assignment">
    <div class="dashboard-card__top">
      <span
        class="dashboard-card__icon"
        aria-hidden="true"
      >
        ●
      </span>

      <div class="dashboard-card__value">
        <strong>16</strong>
        <span>Assigned to me</span>
      </div>
    </div>

    <p class="dashboard-card__trend">
      0%
      <span>vs. previous week</span>
    </p>
  </article>
</section>

<section class="dashboard-placeholder">
  <h2>Operational summary</h2>

  <p>
    Charts, recent incidents and shortcuts will appear here.
  </p>
</section>
